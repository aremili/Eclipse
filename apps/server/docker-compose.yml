name: eclipse-app

services:
  postgres:
    image: postgres:17
    container_name: test-stack-app-postgres
    environment:
      POSTGRES_DB: test-stack-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app_postgres_data: